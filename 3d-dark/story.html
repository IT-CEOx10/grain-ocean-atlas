<!DOCTYPE html>
<!-- «Путь зерна» — сквозная презентация: все экраны разделов 01–08
     из docs/flow-spec.md в одном приложении. Она же главное меню стенда:
     кнопка «Маршруты экспорта» уводит на экран глобуса (index.html),
     а он возвращает сюда кнопкой «Главное меню». Адреса разделов
     считает U.sectionUrl в src/util.js.
     Экран схемы (path.html) в основном сценарии не участвует. -->
<html lang="ru" class="theme-green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Путь зерна — презентация</title>
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/story.css">
</head>
<body class="story-screen">

<!-- Обёртка раздела. В едином приложении app.html таких три,
     по одной на раздел. Здесь она одна и сразу видима (is-on). -->
<div id="sec-story" class="sec story-screen is-on">
<div id="stage">
  <div id="card">
    <canvas id="stars"></canvas>
    <!-- сюда src/story.js рисует текущий экран -->
    <div id="view"></div>
    <div id="loading" class="loading">Загрузка…</div>
  </div>
</div>
</div>

<!-- штора между разделами: гасит стык двух отдельных страниц -->
<div id="page-fade" class="is-on"></div>

<script src="src/util.js"></script>
<script src="src/story-content.js"></script>
<script src="src/story.js"></script>
</body>
</html>
